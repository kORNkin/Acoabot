<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ACOABOT - Automated Cocoa Garden Robot</title>
    <style>
        /* General Styling */
        body {
            font-family: Arial, sans-serif;
            margin: 0;
            padding: 0;
            background-color: #e8faf0;
        }
        header {
            background: rgb(206,233,255);
            background: linear-gradient(180deg, rgba(206,233,255,1) 0%, rgba(232,250,240,1) 100%);
            background-size: contain;
            text-align: center;
            font-size: 24px;
            font-weight: bold;
            color: #3C4858;
            margin: 0;
            padding: 0;
            width: 100%;
        }
        header img {
            width: 300px ;
        }
        img {
            max-width: 100%;
            height: auto;
            width: auto\9; /* ie8 */
        }

        .content {
            display: flex;
            justify-content: space-evenly;
            flex-wrap: wrap;
            padding: 20px;
        }
        .video-feed {
            flex: 2;
            margin-right: 20px;
        }
        .video-feed img {
            object-fit: contain;
            border-radius: 10px;

            border: 2px solid #3C4858;
            
        }
        .info-panel {
            display: flex;
            justify-content: space-evenly;
            flex: 1;
            background-color: white;
            padding: 20px;
            border-radius: 10px;
            box-shadow: 0px 0px 10px rgba(0, 0, 0, 0.1);
        }
        .info-panel p {
            margin: 10px 0;
            font-size: 30px;
            color: #3C4858;
        }

        /* Setting */
        .setting {
            display: flex;
            justify-content: center;
            align-items: center;
            flex-wrap: wrap;
            padding: 0 20px;
            margin-top: 30px;
        }   

        /* Control Panel Styling */
        .control-container {
            display: flex;
            justify-content: space-evenly;
            align-items: center;
            padding: 0 20px;
            margin-top: 30px;
        }
        .control-mode {
            flex: 1;
            text-align: center;
        }
        .control-mode button {
            padding: 10px 20px;
            border-radius: 20px;
            border: none;
            font-size: 30px;
            cursor: pointer;
            background-color: #B3E5FC;
            color: #3C4858;
            margin: 10px 0;
            display: block;
            width: 80%;
            margin-left: auto;
            margin-right: auto;
        }
        .control-mode button.active {
            background-color: #64B5F6;
            color: white;
            text-shadow: 2px 2px #000000;
        }
        .flash-button button:active {
            border: 7px solid #e7de6c;
        }
        .joystick-container {
            flex: 2;
            text-align: center;
        }
        .joystick {
            display: grid;
            grid-template-columns: 100px 100px 100px;
            grid-template-rows: 100px 100px 100px;
            justify-content: center;
            align-items: center;
            gap: 10px;
            position: relative;
        }
        .joystick button {
            background-color: #FFFFFF;
            border: 4px solid #3C4858;
            padding: 15px;
            border-radius: 50%;
            font-size: 30px;
            cursor: pointer;
            width: 100px;
            height: 100px;
        }
        .joystick button:active {
            border: 7px solid #6bbf5a;
        }
        .joystick .up {
            grid-column: 2;
            grid-row: 1;
        }
        .joystick .left {
            grid-column: 1;
            grid-row: 2;
        }
        .joystick .right {
            grid-column: 3;
            grid-row: 2;
        }
        .joystick .down {
            grid-column: 2;
            grid-row: 3;
        }
        
        .direction-buttons {
            display: grid;
            grid-template-columns: 100px 100px;
            grid-template-rows: 100px 100px;
            justify-content: center;
            align-content: center;
            align-items: center;
            flex: 1;
            margin: 0 20px;
            gap: 20px;
            text-align: center;
        }
        .direction-buttons button {
            background-color: #FFFFFF;
            border: 4px solid #3C4858;
            padding: 15px;
            border-radius: 50%;
            font-size: 30px;
            cursor: pointer;
            width: 100px;
            height: 100px;
        }
        .direction-buttons button:active {
            border: 7px solid #5aa6bf;
        }
        .direction-buttons .text {
            font-size: 14px;
            color: #3C4858;
            margin-bottom: 5px;
        }

        .stop-button {
            display: flex;
            justify-content: space-around;
            align-items: center;
            flex: 1;
            margin: 0 20px;
            text-align: center;
        }
        .stop-button button {
            background-color: #FFFFFF;
            border: 4px solid #3C4858;
            padding: 15px;
            border-radius: 50%;
            font-size: 30px;
            cursor: pointer;
            width: 100px;
            height: 100px;
        }
        .stop-button button:active {
            border: 7px solid #bf5a5a;
        }
        .stop-button .text {
            font-size: 14px;
            color: #3C4858;
            margin-bottom: 5px;
        }

        .camera-mode {
            flex: 1;
            text-align: center;
            justify-content: center;
            align-content: center;
        }
        .camera-mode button {
            padding: 10px 20px;
            border-radius: 20px;
            border: none;
            font-size: 25px;
            cursor: pointer;
            background-color: #B3E5FC;
            color: #3C4858;
            margin: 10px 0;
            display: block;
            width: 100%;
            margin-left: auto;
            margin-right: auto;
        }
        .camera-mode button.active {
            background-color: #64B5F6;
            color: white;
            text-shadow: 2px 2px #000000;
        }

        .camera-lift-container {
            flex: 2;
            text-align: center;
        }
        .camera-lift {
            display: grid;
            grid-template-columns: 80px 80px 80px;
            grid-template-rows: 80px 80px 80px;
            justify-content: center;
            align-items: center;
            gap: 0px;
            position: relative;
        }
        .camera-lift button {
            background-color: #FFFFFF;
            border: 4px solid #3C4858;
            padding: 15px;
            border-radius: 50%;
            font-size: 30px;
            cursor: pointer;
            width: 100px;
            height: 100px;
        }
        .camera-lift button:active {
            border: 7px solid #936ce7;
        }
        .camera-lift .up {
            grid-column: 2;
            grid-row: 1;
        }
        .camera-lift .down {
            grid-column: 2;
            grid-row: 3;
        }
        
        .camera-joystick-container {
            flex: 2;
            text-align: center;
        }
        .camera-joystick {
            display: grid;
            grid-template-columns: 100px 100px 100px;
            grid-template-rows: 100px 100px 100px;
            justify-content: center;
            align-items: center;
            gap: 10px;
            position: relative;
        }
        .camera-joystick button {
            background-color: #FFFFFF;
            border: 4px solid #3C4858;
            padding: 15px;
            border-radius: 50%;
            font-size: 30px;
            cursor: pointer;
            width: 100px;
            height: 100px;
        }
        .camera-joystick button:active {
            border: 7px solid #936ce7;
        }
        .camera-joystick .up {
            grid-column: 2;
            grid-row: 1;
        }
        .camera-joystick .left {
            grid-column: 1;
            grid-row: 2;
        }
        .camera-joystick .right {
            grid-column: 3;
            grid-row: 2;
        }
        .camera-joystick .down {
            grid-column: 2;
            grid-row: 3;
        }

        .flash-button {
            display: flex;
            justify-content: space-around;
            align-items: center;
            flex: 1;
            margin: 0 20px;
            text-align: center;
        }
        .flash-button button {
            background-color: #FFFFFF;
            border: 4px solid #3C4858;
            padding: 15px;
            border-radius: 50%;
            font-size: 30px;
            cursor: pointer;
            width: 100px;
            height: 100px;
        }
        .flash-button .text {
            font-size: 14px;
            color: #3C4858;
            margin-bottom: 5px;
        }

        /* Auto Mode Panel */
        .auto-panel {
            display: none;
            flex-direction: column;
            flex: 2;
            text-align: center;
            justify-content: center;
            align-items: center;
            align-content: center;
            font-size: 20px;
        }
        .auto-panel h2 {
            margin-bottom: 10px;
        }
        .auto-panel input {
            width: 80%;
            padding: 40px;
            margin-bottom: 10px;
            border-radius: 10px;
            border: 0px solid #3C4858;
            font-size: 25px;
        }
        .auto-panel .input-positions {
            display: flex;
            flex-direction: column;
            gap: 10px;
        }
        
        .home-input button {
            padding: 20px 5px;
            border-radius: 20px;
            border: none;
            font-size: 20px;
            cursor: pointer;
            background-color: #24b4fb;
            color: #fff;
            margin: 10px 0;
            display: block;
            width: 250px;
            height: 80px;
            /* margin-left: auto; */
            /* margin-right: auto; */
            font-weight: 600;
        }
        .home-input button:hover {
            background-color: #0071e2;
        }

        .home-input-btn {
            display: flex;
            justify-content: center;
            gap: 30px;
        }
        .ml16 {
            color: #22b027;
            font-weight: 800;
            font-size: 2.5em;
            text-transform: uppercase;
            /* letter-spacing: 0.5em; */
            overflow: hidden;
            opacity: 0%;
        }

        .ml16 .letter {
            display: inline-block;
            line-height: 1em;
        }

        .waypoint button.add-button {
            margin-left: auto;
            margin-right: auto; 
            border: 2px solid #24b4fb;
            background-color: #24b4fb;
            border-radius: 0.9em;
            cursor: pointer;
            padding: 0.8em 1.2em 0.8em 1em;
            transition: all ease-in-out 0.2s;
            font-size: 20px;
        }

        .waypoint button.add-button span {
            display: flex;
            justify-content: center;
            align-items: center;
            color: #fff;
            font-weight: 600;
        }
        .waypoint button.add-button:hover {
            background-color: #0071e2;
        }

        .waypoint button.remove-button {
            border: 2px solid #ffcfca;
            background-color: #ffcfca;
            border-radius: 0.9em;
            cursor: pointer;
            padding: 0.8em 1.2em 0.8em 1em;
            transition: all ease-in-out 0.2s;
            font-size: 20px;
        }
        .waypoint button.remove-button:hover {
            background-color: #f17f72;
        }

        .waypoint-list {
            margin-top: 10px;
            max-height: 150px;
            overflow-y: auto;
            border: 1px solid #E0E0E0;
            padding: 10px;
            border-radius: 5px;
        }
    </style>
</head>
<body>
    <header><img src="{{url_for('static', filename='Acoabot.png')}}" alt="Acoabot"></header>
    <div class="content">
        <div class="video-feed" style="max-width:600px;">
            <h2>Farm View</h2>
            <img src="{{ url_for('webcam') }}" alt="Farm View">
        </div>
        <div class="info-panel">
            <div class="gps">
                <p><strong>GPS:</strong> <span id="gps-coordinates">8.368097, 100.043839</span></p>
            </div>
            <div class="disease-status">
                <p><strong>Amount of Infected plants:</strong> <span id="infected-count">5 plants</span></p>
                <p><strong>Blackpod:</strong> <span id="blackpod-count">2 plants</span></p>
                <p><strong>Frostypod:</strong> <span id="frostypod-count">1 plant</span></p>
                <p><strong>Mirid:</strong> <span id="mirid-count">2 plants</span></p>
            </div>
        </div>
    </div>
    <div class="setting">
        <div class="control-mode">
            <button id="auto-btn" class="active">Auto</button>
            <button id="manual-btn">Manual</button>
        </div>
        <div class="flash-button">
            <div>
                <button onclick="sendCommand('f'); return false;" ontouchstart=""><img src="{{url_for('static', filename='light.png')}}" alt="light"></button>
            </div>
        </div>
    </div>
    <div class="control-container">
        <div id="manual-controls" style="display: none; width: 100%; flex-wrap: wrap;">
            <div class="joystick-container">
                <h2>Acoabot</h2>
                <div class="joystick">
                    <button class="up" onclick="sendCommand('w'); return false;" ontouchstart=""><img src="{{url_for('static', filename='up.png')}}" alt="up"></button>
                    <button class="left" onclick="sendCommand('a'); return false;" ontouchstart=""><img src="{{url_for('static', filename='left.png')}}" alt="left"></button>
                    <button class="right" onclick="sendCommand('d'); return false;" ontouchstart=""><img src="{{url_for('static', filename='right.png')}}" alt="right"></button>
                    <button class="down" onclick="sendCommand('s'); return false;" ontouchstart=""><img src="{{url_for('static', filename='down.png')}}" alt="down"></button>
                </div>
            </div> 
            <div class="direction-buttons">
                <div>
                    <button class="straight" onclick="sendCommand('x'); return false;" ontouchstart=""><img src="{{url_for('static', filename='straight.png')}}" alt="straight" style="width:50px;"></button>
                </div>
                <div>
                    <button class="turn-around" onclick="sendCommand('z'); return false;" ontouchstart=""><img src="{{url_for('static', filename='turn-around.png')}}" alt="turn-around" style="width:50px;"></button>
                </div>
                <div>
                    <button class="turn-left" onclick="sendCommand('q'); return false;" ontouchstart=""><img src="{{url_for('static', filename='turn-left.png')}}" alt="turn-left" style="width:50px;"></button>
                </div>
                <div>
                    <button class="turn-right" onclick="sendCommand('e'); return false;" ontouchstart=""><img src="{{url_for('static', filename='turn-right.png')}}" alt="turn-right" style="width:50px;"></button>
                </div>
            </div>
            <div class="stop-button">
                <div>
                    <button onclick="sendCommand('h'); return false;" ontouchstart="">Stop</button>
                </div>
            </div>
            <div class="camera-mode">
                <button id="camera-self-stabilize" class="active">Self Stabilize</button>
                <button id="camera-manual">Manual</button>
            </div>
            <div id="camera-setting" style="display:none">
                <div class="camera-lift-container">
                    <h2>Lifting</h2> <br><br>
                    <div class="camera-lift"> 
                        <button class="up" onclick="sendCommand('w'); return false;" ontouchstart=""><img src="{{url_for('static', filename='up.png')}}" alt="up"></button>
                        <button class="down" onclick="sendCommand('s'); return false;" ontouchstart=""><img src="{{url_for('static', filename='down.png')}}" alt="down"></button>
                    </div>
                </div>
                <div class="camera-joystick-container">
                    <h2>Camera</h2>
                    <div class="camera-joystick">
                        <button class="up" onclick="sendCommand('w'); return false;" ontouchstart=""><img src="{{url_for('static', filename='up.png')}}" alt="up"></button>
                        <button class="left" onclick="sendCommand('u'); return false;" ontouchstart=""><img src="{{url_for('static', filename='left.png')}}" alt="left"></button>
                        <button class="right" onclick="sendCommand('o'); return false;" ontouchstart=""><img src="{{url_for('static', filename='right.png')}}" alt="right"></button>
                        <button class="down" onclick="sendCommand('s'); return false;" ontouchstart=""><img src="{{url_for('static', filename='down.png')}}" alt="down"></button>
                    </div>
                </div> 
            </div>
        </div>
        <div id="auto-controls" class="auto-panel" style="display: flex;">
            <div class="home-input">
                <h2>Home:</h2>
                 <input class="input" id="home-position" placeholder="Starting point Ex. 8.368097, 100.043839" required="" type="text">
               

                <div class="home-input-btn">
                    <button id="submit-btn" onclick="submitHome()">Submit</button>
                    <h1 class="ml16">✔</h1>
                    <script src="https://cdnjs.cloudflare.com/ajax/libs/animejs/2.0.2/anime.min.js"></script>
                </div>
            </div>
            <h2>Waypoint:</h2>
            <input type="text" id="new-waypoint" placeholder="Enter a new waypoint">
            <div class="waypoint">
                <button class="add-button"onclick="addWaypoint()">
                    <span>
                        <svg
                        height="30"
                        width="30"
                        viewBox="0 0 30 30"
                        xmlns="http://www.w3.org/2000/svg"
                        >
                        <path d="M0 0h24v24H0z" fill="none"></path>
                        <path d="M11 11V5h2v6h6v2h-6v6h-2v-6H5v-2z" fill="currentColor"></path>
                    </svg>
                        Add Waypoint
                    </span>
                </button>
                <button class="remove-button" onclick="removeWaypoint()" style="width: 80px;"> <img src="{{url_for('static', filename='remove.png')}}" alt="remove"> </button>
            </div>
            <div class="waypoint-list" id="waypoint-list" style="font-size: 30px;"></div>
        </div>
    </div>

    <script>
        const gpsCoordinates = document.getElementById('gps-coordinates');
        const infectedCount = document.getElementById('infected-count');
        const blackpodCount = document.getElementById('blackpod-count');
        const frostypodCount = document.getElementById('frostypod-count');
        const miridCount = document.getElementById('mirid-count');
        const manualBtn = document.getElementById('manual-btn');
        const autoBtn = document.getElementById('auto-btn');
        const manualControls = document.getElementById('manual-controls');
        const camStabilize = document.getElementById('camera-self-stabilize');
        const camManual = document.getElementById('camera-manual');
        const camSetting = document.getElementById('camera-setting');
        const autoControls = document.getElementById('auto-controls');
        const homePositionInput = document.getElementById('home-position');
        const newWaypointInput = document.getElementById('new-waypoint');
        const waypointList = document.getElementById('waypoint-list');
        
        

        function sendCommand(command) {
            var xhr = new XMLHttpRequest();
            xhr.open('GET', '/send_command/' + command, true);
            xhr.send();
        }

        // Switching between Manual and Auto Mode
        manualBtn.addEventListener('click', () => {
            manualBtn.classList.add('active');
            autoBtn.classList.remove('active');
            manualControls.style.display = 'flex';
            autoControls.style.display = 'none';

            fetch('/set_mode', {
                method: 'POST',
                headers: {
                    'Content-Type': 'application/json'
                },
                body: JSON.stringify({ mode: 'manual' })
            })
            .then(response => response.json())
            .then(data => console.log(data))
            .catch(error => console.error('Error:', error));
        });
        autoBtn.addEventListener('click', () => {
            autoBtn.classList.add('active');
            manualBtn.classList.remove('active');
            manualControls.style.display = 'none';
            autoControls.style.display = 'flex';
            fetch('/set_mode', {
                method: 'POST',
                headers: {
                    'Content-Type': 'application/json'
                },
                body: JSON.stringify({ mode: 'auto' })
            })
            .then(response => response.json())
            .then(data => console.log(data))
            .catch(error => console.error('Error:', error));
        });

        // Switching between Self Stabilize and Manual Camera Control
        camStabilize.addEventListener('click', () => {
            camStabilize.classList.add('active');
            camManual.classList.remove('active');
            camSetting.style.display = 'none';

            fetch('/camera_set_mode', {
                method: 'POST',
                headers: {
                    'Content-Type': 'application/json'
                },
                body: JSON.stringify({ mode: 'stabilize' })
            })
            .then(response => response.json())
            .then(data => console.log(data))
            .catch(error => console.error('Error:', error));
        });
        camManual.addEventListener('click', () => {
            camManual.classList.add('active');
            camStabilize.classList.remove('active');
            camSetting.style.display = 'flex';

            fetch('/camera_set_mode', {
                method: 'POST',
                headers: {
                    'Content-Type': 'application/json'
                },
                body: JSON.stringify({ mode: 'manual' })
            })
            .then(response => response.json())
            .then(data => console.log(data))
            .catch(error => console.error('Error:', error));
        });

        setInterval(() => {
            fetch('/get_gps')
                .then(response => response.json())
                .then(data => gpsCoordinates.textContent = data.gps)
                .catch(error => console.error('Error:', error));

            fetch('/get_infected_data')
                .then(response => response.json())
                .then(data => {
                    infectedCount.textContent = `${data.infected} plants`;
                    blackpodCount.textContent = `${data.blackpod} plants`;
                    frostypodCount.textContent = `${data.frostypod} plants`;
                    miridCount.textContent = `${data.mirid} plants`;
                })
                .catch(error => console.error('Error:', error));
        }, 1000);     

        //Submit home to server
        function submitHome() {
            const homePosition = homePositionInput.value;
            if (homePosition){
                var textWrapper = document.querySelector('.ml16');
                textWrapper.innerHTML = textWrapper.textContent.replace(/\S/g, "<span class='letter'>$&</span>");
                anime.timeline({loop: false})
                .add({
                    targets: '.ml16',
                    opacity: 1,
                }).add({
                    targets: '.ml16 .letter',
                    translateY: [-100,0],
                    easing: "easeOutExpo",
                    duration: 1300,
                    delay: (el, i) => 30 * i
                }).add({
                    targets: '.ml16',
                    opacity: 0,
                    duration: 1000,
                    easing: "easeOutExpo",
                });
                
                //code set home point here
            }
        }

        // Function to add new waypoint
        function addWaypoint() {
            const newWaypoint = newWaypointInput.value;
            if (newWaypoint) {
                const listItem = document.createElement('p');
                listItem.textContent = waypointList.childElementCount + 1
                listItem.textContent += ". " + newWaypoint;
                waypointList.appendChild(listItem);
                newWaypointInput.value = '';  
                
                //code add waypoint to server here
            }
        }
        //Remove waypoint
        function removeWaypoint() {
            if(waypointList.lastChild){
                waypointList.removeChild(waypointList.lastChild);

                //code remove last waypoint to server here
            }
        }
        
            
    </script>
</body>
</html>
